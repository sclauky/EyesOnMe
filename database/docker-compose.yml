name: eyesonme

services:
  db:
    image: postgres:16.6-alpine
    container_name: eyesonme_db
    restart: unless-stopped
    # Aucun "ports:" : la base n'est joignable que par le réseau Docker eyesonme_net.
    environment:
      POSTGRES_USER: eyesonme_owner
      POSTGRES_PASSWORD: ${EYESONME_OWNER_PASSWORD:?défini dans .env}
      POSTGRES_DB: ${EYESONME_DB:-eyesonme}
      EYESONME_APP_PASSWORD: ${EYESONME_APP_PASSWORD:?défini dans .env}
    # Réglage léger pour une machine de 1 Go de RAM partagée avec 8 autres conteneurs.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
      - -c
      - work_mem=4MB
      - -c
      - effective_cache_size=256MB
    volumes:
      - eyesonme_pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - eyesonme_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eyesonme_owner -d ${EYESONME_DB:-eyesonme}"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  # API en lecture seule. Publiée sur 127.0.0.1 uniquement : le Nginx de l'hôte la joint, pas Internet.
  api:
    build: ./api
    image: eyesonme_api:0.1.0
    container_name: eyesonme_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://eyesonme_app:${EYESONME_APP_PASSWORD:?défini dans .env}@db:5432/${EYESONME_DB:-eyesonme}
      CORS_ORIGINS: ${CORS_ORIGINS:?défini dans .env}
    ports:
      - "127.0.0.1:8200:8000"
    networks:
      - eyesonme_net
    deploy:
      resources:
        limits:
          memory: 96M

  # Migrations : docker compose run --rm tools up   (rôle propriétaire, jamais le rôle applicatif)
  tools:
    image: amacneil/dbmate:2
    profiles: [tools]
    environment:
      DATABASE_URL: postgres://eyesonme_owner:${EYESONME_OWNER_PASSWORD:?défini dans .env}@db:5432/${EYESONME_DB:-eyesonme}?sslmode=disable
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./migrations:/db/migrations:ro
    networks:
      - eyesonme_net

volumes:
  eyesonme_pgdata:
    name: eyesonme_pgdata

networks:
  eyesonme_net:
    name: eyesonme_net
